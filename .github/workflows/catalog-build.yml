name: Build and refresh study-material catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "script.js"
      - "scripts/build-catalog.mjs"
      - ".github/workflows/catalog-build.yml"

permissions:
  contents: write

concurrency:
  group: catalog-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test catalogue builder
        run: node --test tests/catalog-build.test.mjs

      - name: Pre-render Google Sheets catalogue
        run: node scripts/build-catalog.mjs

      - name: Commit refreshed HTML and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml catalog-data.json
          if git diff --cached --quiet; then
            echo "Catalogue and sitemap are already up to date."
          else
            git commit -m "chore: refresh prerendered study catalogue"
            git push
          fi
