name: Site smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run site smoke tests
        run: node --test tests/site-smoke.test.mjs

      - name: Check JavaScript syntax
        run: |
          for file in sw.js edubot-loader.js script.js gemini-ai.js; do
            node --check "$file"
          done
