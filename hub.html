<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a192f">
  <meta name="description" content="The ICSE Hub mini app inside the ICSE MasterClass study portal.">
  <title>The ICSE Hub Mini App | ICSE MasterClass</title>
  <style>
    :root{color-scheme:dark;--navy:#0a192f;--panel:#101f35;--amber:#f59e0b;--muted:#aab7c8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--navy);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,3vw,2rem);border-bottom:1px solid #263750;background:#0b172a;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:.75rem}
    .mark{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:.9rem;background:#f59e0b1a;border:1px solid #f59e0b55;color:var(--amber);font-size:1.2rem}
    h1{font-size:clamp(1rem,2vw,1.25rem);margin:0;font-weight:850}
    .sub{font-size:.78rem;color:var(--muted);margin:.25rem 0 0}
    .actions{display:flex;gap:.6rem;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none;border-radius:.75rem;padding:.7rem 1rem;font-size:.82rem;font-weight:800;border:1px solid #34445d;color:#eaf0f8;background:#13243c}
    .btn.primary{background:var(--amber);color:#101827;border-color:var(--amber)}
    main{padding:clamp(.75rem,2vw,1.25rem)}
    .notice{max-width:1600px;margin:0 auto 1rem;color:var(--muted);font-size:.82rem;line-height:1.5}
    .frame-wrap{max-width:1600px;margin:auto;border:1px solid #30425b;border-radius:1rem;overflow:hidden;background:#0c1524;box-shadow:0 16px 50px #0003}
    iframe{display:block;width:100%;height:calc(100dvh - 180px);min-height:580px;border:0;background:#0c1524}
    @media(max-width:600px){header{align-items:flex-start}.actions{width:100%}.btn{flex:1}iframe{height:calc(100dvh - 220px);min-height:560px}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">✦</div>
      <div><h1>The ICSE Hub <span style="color:#f59e0b">Mini App</span></h1><p class="sub">A learning workspace inside ICSE MasterClass</p></div>
    </div>
    <nav class="actions" aria-label="Mini app actions">
      <a class="btn" href="./" aria-label="Return to study materials">← Study Materials</a>
      <a class="btn primary" href="https://icse-cbse-10-12.github.io/The-ICSE-Hub/" target="_blank" rel="noopener noreferrer">Open Full App ↗</a>
    </nav>
  </header>
  <main>
    <p class="notice">Use the embedded workspace below. If it does not load in your browser, choose <strong>Open Full App</strong> to launch it separately.</p>
    <div class="frame-wrap">
      <iframe
        src="https://icse-cbse-10-12.github.io/The-ICSE-Hub/"
        title="The ICSE Hub learning workspace"
        loading="eager"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </main>
</body>
</html>
